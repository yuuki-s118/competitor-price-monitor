# Render Blueprint。Renderダッシュボードで「New Blueprint」からこのリポジトリを指定すると
# 以下のサービス一式(DB・バックエンド・フロントエンド)が一括で作成される。
# すべてFreeプランで組んでいるため費用は発生しないが、下記の制約がある。
#
# - Postgres(Free)は作成から30日で有効期限が切れる(その後14日の猶予期間を過ぎるとデータごと削除される)。
#   ポートフォリオとして常時公開し続ける場合は、有効期限が近づいたらRenderダッシュボードから
#   有料プランへのアップグレード(またはDBの再作成)が必要。
# - RenderのFreeプランでは Background Worker(常時稼働プロセス)自体が有料($7/月〜)だったため、
#   本番ではCelery worker/Redisを使わない。毎時の価格収集は、GitHub Actions
#   (`.github/workflows/collect-prices.yml`)のスケジュール実行から
#   `POST /api/internal/collect-all-prices`(共有シークレットで認証)を叩く方式にしている。
#   ローカル(docker-compose)では引き続き Celery + Redis + beat の構成で動かしており、
#   非同期タスクキューとしてのCelery自体のコード・テストはそのまま残っている。
# - pre-deploy commandはFreeプランのサービスでは使えないため、マイグレーション(`alembic upgrade head`)は
#   バックエンドの起動コマンドの一部として、`uvicorn` の起動前に毎回実行する構成にしている
#   (適用済みのマイグレーションは何もしないため、繰り返し実行しても問題ない)。
#
# JWT_SECRET_KEY・RAKUTEN_*・SMTP_*・INTERNAL_TASK_SECRET は `sync: false` にしているため、
# Blueprint適用後にRenderダッシュボードの各サービスの Environment タブから値を入力する。

envVarGroups:
  - name: competitor-price-monitor-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET_KEY
        sync: false
      - key: RAKUTEN_APP_ID
        sync: false
      - key: RAKUTEN_ACCESS_KEY
        sync: false
      - key: RAKUTEN_ALLOWED_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: INTERNAL_TASK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://competitor-price-monitor-frontend.onrender.com"]'

databases:
  - name: competitor-price-monitor-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: competitor-price-monitor-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: competitor-price-monitor-shared
      - key: DATABASE_URL
        fromDatabase:
          name: competitor-price-monitor-db
          property: connectionString

  - type: web
    name: competitor-price-monitor-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://competitor-price-monitor-backend.onrender.com
